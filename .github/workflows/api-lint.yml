name: API Specification Linting

on:
  push:
    paths:
      - 'docs/references/api.yml'
      - '.spectral.yml'
  pull_request:
    paths:
      - 'docs/references/api.yml'
      - '.spectral.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-api-spec:
    name: Lint OpenAPI Specification
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        
      - name: Lint OpenAPI specification with Spectral
        continue-on-error: true
        uses: stoplightio/spectral-action@v0.8.13
        with:
          file_glob: 'docs/references/api.yml'
          spectral_ruleset: '.spectral.yml'